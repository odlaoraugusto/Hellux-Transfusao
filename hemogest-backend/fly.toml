# fly.toml — HemoGest API (backend)
#
# Configuração de deploy no Fly.io. NÃO contém segredos — tudo que é
# sensível (JWT_SECRET_KEY, DATABASE_URL, FIELD_ENCRYPTION_KEY, credenciais
# de MinIO/S3 etc.) vai via `fly secrets set` (ver hemogest-backend/DEPLOY.md).
#
# 'app' abaixo é um placeholder — nomes de app no Fly são globalmente únicos.
# Troque para o nome real escolhido em `fly launch` / `fly apps create` antes
# do primeiro deploy. O frontend (Opção A do DEPLOY.md) aponta pra URL
# pública deste app via VITE_API_BASE_URL no build — se trocar o nome aqui,
# lembre de trocar também o valor de VITE_API_BASE_URL no deploy do frontend.
#
# ATENÇÃO: a sintaxe do fly.toml e as flags do flyctl mudam de tempos em
# tempos. Antes do primeiro deploy, rode `fly config validate` nesta pasta
# pra confirmar que este arquivo ainda está no formato esperado pela versão
# instalada da CLI.
app = "hemogest-backend"
primary_region = "gru" # São Paulo — decisão deliberada por residência de dados (LGPD)

[build]
  dockerfile = "Dockerfile"

[env]
  # Só configuração não-sensível. CORS_ORIGINS é uma lista de origens
  # públicas (não é segredo), por isso pode ir aqui — mas o valor abaixo é
  # só placeholder de exemplo, ajuste pro domínio real do frontend antes do
  # deploy. Pydantic-settings espera uma string JSON-array para List[str].
  APP_ENV = "production"
  APP_DEBUG = "false"
  CORS_ORIGINS = '["https://hemogest-frontend.fly.dev"]'
  LOG_LEVEL = "INFO"
  LOG_JSON = "true"
  # Uso interno pequeno, sem domínio próprio nem publicação pública — disco
  # local (num Fly Volume persistente, ver [mounts] abaixo) evita depender
  # de um provedor S3 externo. Só funciona com 1 máquina (sem
  # auto-scaling horizontal), o que já é o caso aqui (min/max = 1).
  STORAGE_BACKEND = "local"
  LOCAL_STORAGE_PATH = "/app/storage"

[http_service]
  internal_port = 8000
  force_https = true
  # Não há [processes] aqui de propósito: o comando de start (uvicorn com
  # --proxy-headers) vive só no CMD do Dockerfile, pra não ter duas fontes
  # de verdade sobre como a API sobe.
  # Ferramenta de controle interno, uso esporádico (não é sistema clínico
  # de plantão 24/7) — prioriza economia sobre latência: a máquina desliga
  # sozinha sem tráfego e liga de novo no próximo request (alguns segundos
  # de cold start, aceitável aqui). Se um dia isso virar uso crítico/contínuo,
  # troque para auto_stop_machines = false + min_machines_running = 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"
    protocol = "http"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "hemogest_storage"
  destination = "/app/storage"
