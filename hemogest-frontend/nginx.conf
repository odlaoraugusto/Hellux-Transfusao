# nginx.conf — HemoGest Frontend (SPA)
# Porta 8080 (não 80): evita precisar rodar o master process como root só
# pra bindar em porta privilegiada — casa com o resto do hardening do projeto.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA com client-side routing (react-router-dom): qualquer rota
    # desconhecida cai no index.html e o React Router decide o resto.
    # Sem isso, F5 numa rota tipo /pacientes/123 devolve 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite já versiona) podem cachear "para sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca deve ser cacheado — é ele que referencia os assets
    # versionados; se ficar em cache, o usuário fica preso numa versão velha.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Headers básicos de segurança na resposta estática. CSP não entra aqui
    # de propósito — definir uma CSP correta depende de conhecer todos os
    # domínios externos que o app carrega (fonts do Google, API, etc.) e é
    # fácil quebrar o app com uma CSP mal calibrada; fica como próximo passo,
    # não bloqueante pro deploy inicial.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
