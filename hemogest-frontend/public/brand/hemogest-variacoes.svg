<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220">
  <title>Variações de cor — Símbolo Hellux</title>
  <defs>
    <symbol id="hg-icon" viewBox="0 0 200 200">
      <path d="M100,16 L162,42 L162,104 C162,146 133,174 100,188 C67,174 38,146 38,104 L38,42 Z"
            class="c-shield" stroke-width="7" stroke-linejoin="round"/>
      <rect x="91" y="46" width="18" height="18" rx="4" class="c-fill"/>
      <path d="M100,58 C122,84 133,106 133,123 C133,143 118,157 100,157 C82,157 67,143 67,123 C67,106 78,84 100,58 Z"
            class="c-fill"/>
      <path d="M86,100 C82,112 82,124 90,133" fill="none" class="c-highlight" stroke-width="5" stroke-linecap="round"/>
    </symbol>
  </defs>

  <style>
    /* Colorida: fundo claro, escudo vermelho vivo, brilho branco */
    .v-colorida .c-shield { fill:#FFFFFF; stroke:#C62828; }
    .v-colorida .c-fill { fill:#C62828; }
    .v-colorida .c-highlight { stroke:#FFFFFF; }

    /* Negativa: fundo vermelho escuro sólido, escudo e bolsa em branco */
    .v-negativa .c-shield { fill:none; stroke:#FFFFFF; }
    .v-negativa .c-fill { fill:#FFFFFF; }
    .v-negativa .c-highlight { stroke:#8E1B1B; }

    /* Monocromática: fundo claro, tudo em cinza-escuro */
    .v-mono .c-shield { fill:#FFFFFF; stroke:#616161; }
    .v-mono .c-fill { fill:#616161; }
    .v-mono .c-highlight { stroke:#FFFFFF; }

    /* Monocromática negativa: fundo preto, tudo em branco */
    .v-mononeg .c-shield { fill:none; stroke:#FFFFFF; }
    .v-mononeg .c-fill { fill:#FFFFFF; }
    .v-mononeg .c-highlight { stroke:#000000; }
  </style>

  <g transform="translate(10,10)">
    <rect width="200" height="200" rx="28" fill="#F8FAFC" stroke="#E5E7EB"/>
    <g class="v-colorida"><use href="#hg-icon" width="200" height="200"/></g>
  </g>

  <g transform="translate(240,10)">
    <rect width="200" height="200" rx="28" fill="#8E1B1B"/>
    <g class="v-negativa"><use href="#hg-icon" width="200" height="200"/></g>
  </g>

  <g transform="translate(470,10)">
    <rect width="200" height="200" rx="28" fill="#FFFFFF" stroke="#E5E7EB"/>
    <g class="v-mono"><use href="#hg-icon" width="200" height="200"/></g>
  </g>

  <g transform="translate(700,10)">
    <rect width="200" height="200" rx="28" fill="#000000"/>
    <g class="v-mononeg"><use href="#hg-icon" width="200" height="200"/></g>
  </g>
</svg>
